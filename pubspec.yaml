name: liner_music
description: Cross-platform music aggregator & player inspired by Liner.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.39
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  youtube_explode_dart: ^2.2.1
  http: ^1.2.2
  palette_generator: ^0.3.3+4
  flutter_blurhash: ^0.8.2
  cached_network_image: ^3.4.1
  scrollable_positioned_list: ^0.3.8
  supabase_flutter: ^2.6.0
  flutter_riverpod: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
